services:
  mongodb: #services name
    image: mongo:8.0.20-noble
    container_name: mongodb
    ports:
      - "27007:27017"
    volumes: # whene docker shatdowm the docker will create mongodb file and write on it befor shatdown
      - mongodata:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - backend
    restart: always


networks:
  backend:

volumes: # whene docker shatdowm the docker will create mongodb file and write on it befor shatdown
  mongodata:   
